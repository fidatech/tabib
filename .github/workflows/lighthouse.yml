name: lighthouse

# Measures every sign-in page, the public website and the first page of each panel with Lighthouse,
# on a copy of the system started here with a demonstration clinic. Runs when the file
# .github/lighthouse changes on the development branch, or by hand.

on:
  push:
    branches: [development]
    paths: ['.github/lighthouse']
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, intl, pdo_sqlite, zip, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start the system with a demonstration clinic
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          cp .env.example .env
          set_env() { if grep -q "^$1=" .env; then sed -i "s|^$1=.*|$1=$2|" .env; else echo "$1=$2" >> .env; fi; }
          touch "$PWD/database/central.sqlite"
          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env APP_URL http://localhost:8003
          set_env DB_CONNECTION sqlite
          set_env DB_DATABASE "$PWD/database/central.sqlite"
          set_env CENTRAL_DOMAINS localhost
          set_env TENANT_BASE_DOMAIN localhost
          set_env SESSION_DRIVER file
          set_env SESSION_SECURE_COOKIE false
          set_env CACHE_STORE file
          php artisan key:generate --force
          php artisan migrate --force
          php artisan icd10:import
          php artisan medicines:import
          php artisan app:create-admin --name="System Admin" --email=admin@example.test --password=lighthouse-pass-1
          php artisan tenants:create demo --name="Demo Clinic" --owner-name="Owner One" --owner-email=owner@example.test --owner-password=lighthouse-pass-1
          php artisan tinker --execute="app(App\Tenancy\Tenancy::class)->initialize(App\Models\Central\Tenant::where('slug', 'demo')->sole()); \$u = App\Models\User::create(['name' => 'Dr. Demo', 'email' => 'doctor@example.test', 'password' => 'lighthouse-pass-1', 'branch_id' => 1]); \$u->assignRole('Doctor'); \$d = App\Models\Doctor::create(['user_id' => \$u->id, 'specialty' => 'General practitioner']); \$p = App\Models\Patient::create(['number' => 'P-000001', 'name' => 'Gul Ahmad', 'gender' => 'male']); App\Models\Appointment::create(['patient_id' => \$p->id, 'doctor_id' => \$d->id, 'branch_id' => 1, 'starts_at' => now()->setTime(10, 0), 'ends_at' => now()->setTime(10, 15), 'status' => 'arrived', 'token' => 1]); \$o = App\Models\Doctor::create(['user_id' => 1, 'specialty' => 'Family medicine']); App\Models\Encounter::create(['patient_id' => \$p->id, 'doctor_id' => \$o->id, 'branch_id' => 1, 'started_at' => now(), 'complaint' => 'Cough', 'status' => 'draft']); App\Models\Vital::create(['patient_id' => \$p->id, 'taken_at' => now(), 'systolic' => 130, 'diastolic' => 85, 'pulse' => 80]); \$m = App\Models\Medicine::where('code', 'paracetamol-500-mg-tablet')->sole(); foreach ([1, 2] as \$n) { \$rx = App\Models\Prescription::create(['patient_id' => \$p->id, 'doctor_id' => \$o->id, 'branch_id' => 1, 'status' => 'draft', 'created_by' => 1]); \$rx->items()->create(['medicine_id' => \$m->id, 'name' => \$m->name, 'strength' => \$m->strength, 'form' => \$m->form, 'dose_amount' => 1, 'dose_unit' => 'tablet', 'frequency' => 'tds', 'timing' => 'after_food', 'days' => 5, 'quantity' => '15 tablets', 'position' => 1]); } \$rx->forceFill(['status' => 'signed', 'number' => 'RX-000001', 'signed_at' => now()->startOfSecond(), 'signed_by' => 1, 'verify_token' => str_repeat('a', 32)]); \$rx->signature = hash('sha256', \$rx->signedContent()); \$rx->save(); \$svc = App\Models\Service::create(['name' => 'ECG', 'category' => 'procedure', 'price' => 200]); \$inv = App\Services\Cashier::open(\$p, null, 1); App\Services\Cashier::addLine(\$inv, \$svc, 'ECG', 1, 200); App\Services\Cashier::addLine(\$inv, null, 'Consultation', 1, 300); App\Services\Cashier::pay(\$inv, 300, 'cash', null, 1);"
          php artisan config:cache && php artisan view:cache
          # several workers: the pages ask for their styles and scripts at once
          PHP_CLI_SERVER_WORKERS=6 nohup php artisan serve --host=0.0.0.0 --port=8003 > serve.log 2>&1 &
          sleep 3
          # in front of it, what the real server does: compressed text and long-lived styles, scripts and fonts
          sudo apt-get install -y -qq nginx >/dev/null 2>&1
          sudo tee /etc/nginx/conf.d/lighthouse.conf >/dev/null <<'NGINX'
          server {
              listen 8004;
              gzip on; gzip_proxied any; gzip_min_length 256; gzip_comp_level 6;
              gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
              location ~* \.(css|js|svg|png|woff|woff2)$ {
                  proxy_pass http://127.0.0.1:8003; proxy_set_header Host $http_host;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }
              location / { proxy_pass http://127.0.0.1:8003; proxy_set_header Host $http_host; }
          }
          NGINX
          sudo nginx -t -q && (sudo systemctl restart nginx || sudo nginx)
          sleep 1
          curl -s -o /dev/null -w 'website: %{http_code}\n' http://localhost:8004/
          curl -s -o /dev/null -w 'Clinic sign-in: %{http_code}\n' --resolve demo.localhost:8004:127.0.0.1 http://demo.localhost:8004/login

      - name: Measure
        run: |
          npm install --no-save --silent lighthouse@12 >/dev/null 2>&1
          CHROME_FLAGS="--headless=new --no-sandbox --host-resolver-rules=MAP_demo.localhost_127.0.0.1"
          # sign in with curl, hand the session to Lighthouse
          signin() {  # origin, sign-in path, email  ->  prints the Cookie header
            rm -f jar.txt
            token=$(curl -s -c jar.txt --resolve demo.localhost:8004:127.0.0.1 "$1$2" | sed -n 's/.*name="_token" value="\([^"]*\)".*/\1/p' | head -1)
            curl -s -o /dev/null -b jar.txt -c jar.txt --resolve demo.localhost:8004:127.0.0.1 --data-urlencode "_token=$token" --data-urlencode "email=$3" --data-urlencode "password=lighthouse-pass-1" "$1$2"
            awk '!/^#/ && NF >= 7 {printf "%s%s=%s", sep, $6, $7; sep="; "} /^#HttpOnly_/ {printf "%s%s=%s", sep, $6, $7; sep="; "}' jar.txt
          }
          measure() {  # name, url, cookie
            for form in mobile desktop; do
              extra=(); if [ "$form" = desktop ]; then extra=(--preset=desktop); fi
              headers='{}'; if [ -n "$3" ]; then headers=$(node -e 'console.log(JSON.stringify({Cookie: process.argv[1]}))' "$3"); fi
              npx lighthouse "$2" --quiet --output=json --output-path="out-$1-$form.json" --chrome-flags="$CHROME_FLAGS" --extra-headers="$headers" --disable-storage-reset "${extra[@]}" >/dev/null 2>&1 || echo "Lighthouse failed on $2"
            done
          }
          ADMIN=$(signin http://localhost:8004 /admin/login admin@example.test)
          OWNER=$(signin http://demo.localhost:8004 /login owner@example.test)
          measure website http://localhost:8004/ ""
          measure register http://localhost:8004/register ""
          measure admin-login http://localhost:8004/admin/login ""
          measure clinic-login http://demo.localhost:8004/login ""
          measure admin-panel http://localhost:8004/admin "$ADMIN"
          measure admin-medicines http://localhost:8004/admin/medicines "$ADMIN"
          measure clinic-dashboard http://demo.localhost:8004/ "$OWNER"
          measure clinic-calendar http://demo.localhost:8004/appointments "$OWNER"
          measure clinic-queue http://demo.localhost:8004/queue "$OWNER"
          measure clinic-patients http://demo.localhost:8004/patients "$OWNER"
          measure clinic-booking http://demo.localhost:8004/appointments/create "$OWNER"
          measure clinic-chart http://demo.localhost:8004/patients/1 "$OWNER"
          measure clinic-history http://demo.localhost:8004/patients/1?tab=history "$OWNER"
          measure clinic-visit http://demo.localhost:8004/visits/1 "$OWNER"
          measure clinic-prescription http://demo.localhost:8004/prescriptions/1 "$OWNER"
          measure clinic-rx-signed http://demo.localhost:8004/prescriptions/2 "$OWNER"
          measure clinic-rx-paper "http://demo.localhost:8004/prescriptions/2/print?lang=fa" "$OWNER"
          measure clinic-rx-tab "http://demo.localhost:8004/patients/1?tab=prescriptions" "$OWNER"
          measure clinic-medicines http://demo.localhost:8004/medicines "$OWNER"
          measure rx-check http://demo.localhost:8004/rx/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ""
          measure clinic-invoices http://demo.localhost:8004/invoices "$OWNER"
          measure clinic-invoice http://demo.localhost:8004/invoices/1 "$OWNER"
          measure clinic-invoice-paper http://demo.localhost:8004/invoices/1/print "$OWNER"
          measure clinic-receipt http://demo.localhost:8004/receipts/1 "$OWNER"
          measure clinic-cash http://demo.localhost:8004/cash "$OWNER"
          measure clinic-price-list http://demo.localhost:8004/price-list "$OWNER"
          measure clinic-billing-tab "http://demo.localhost:8004/patients/1?tab=billing" "$OWNER"
          measure clinic-reports http://demo.localhost:8004/reports "$OWNER"
          measure clinic-report-income http://demo.localhost:8004/reports/income "$OWNER"
          measure clinic-report-appointments http://demo.localhost:8004/reports/appointments "$OWNER"
          measure clinic-report-diagnoses http://demo.localhost:8004/reports/diagnoses "$OWNER"
          measure clinic-report-owed http://demo.localhost:8004/reports/owed "$OWNER"
          measure clinic-sms http://demo.localhost:8004/settings/sms "$OWNER"
          measure clinic-note-templates http://demo.localhost:8004/note-templates "$OWNER"
          measure clinic-merge http://demo.localhost:8004/patients/1/merge "$OWNER"
          measure clinic-medicines-list http://demo.localhost:8004/medicines "$OWNER"
          measure clinic-order-form "http://demo.localhost:8004/orders/create?patient=1&kind=lab" "$OWNER"
          measure clinic-letter-form "http://demo.localhost:8004/letters/create?patient=1&kind=sick_leave" "$OWNER"
          measure clinic-summary http://demo.localhost:8004/patients/1/summary "$OWNER"
          measure clinic-rx-card http://demo.localhost:8004/prescriptions/2/card "$OWNER"
          measure clinic-papers-tab "http://demo.localhost:8004/patients/1?tab=papers" "$OWNER"
          measure clinic-doctor-hours http://demo.localhost:8004/doctors/1/schedule "$OWNER"
          measure clinic-import http://demo.localhost:8004/patients/import "$OWNER"
          cat > report.js <<'JS'
          const fs = require('fs');
          for (const file of fs.readdirSync('.').filter((f) => /^out-.*\.json$/.test(f)).sort()) {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const c = r.categories;
            const score = (k) => (c[k] && c[k].score != null ? Math.round(c[k].score * 100) : '-');
            console.log(`\n== ${file.replace(/^out-|\.json$/g, '')}  ${r.finalDisplayedUrl}\n   performance ${score('performance')}  accessibility ${score('accessibility')}  best-practices ${score('best-practices')}  seo ${score('seo')}`);
            if (r.runtimeError) console.log('   RUNTIME ERROR', r.runtimeError.message);
            for (const key of Object.keys(c)) {
              for (const ref of c[key].auditRefs) {
                const a = r.audits[ref.id];
                if (!ref.weight || a.score === null || a.score >= (key === 'performance' ? 0.98 : 1)) continue;
                console.log(`   [${key}] ${a.id}: ${a.title}${a.displayValue ? ' (' + a.displayValue + ')' : ''}`);
                for (const item of ((a.details && a.details.items) || []).slice(0, 5)) {
                  const node = item.node || item.relatedNode || {};
                  const text = node.snippet || item.url || (item.source && item.source.url) || item.description || item.label || JSON.stringify(item).slice(0, 200);
                  console.log('        ' + String(text).slice(0, 220) + (node.explanation ? '  <- ' + String(node.explanation).replace(/\s+/g, ' ').slice(0, 200) : ''));
                }
              }
            }
            const lcp = r.audits['largest-contentful-paint-element'] || r.audits['lcp-breakdown-insight'];
            const blocking = r.audits['render-blocking-insight'] || r.audits['render-blocking-resources'];
            if (score('performance') < 100 && blocking && blocking.displayValue) console.log('   render-blocking: ' + blocking.displayValue);
          }
          JS
          node report.js | tee lighthouse.txt
          { echo '```'; grep -A1 '^== ' lighthouse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -5 serve.log
